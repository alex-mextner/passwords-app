# SPDX-FileCopyrightText: 2026 Alex Mextner
# SPDX-License-Identifier: MIT
#
# Licensing for files that cannot or should not carry an SPDX header themselves. Source files
# (.py, .sh, .ts, .js) are deliberately NOT covered by a catch-all here: each must carry its
# own header, so `reuse lint` flags any new file that forgot one.
version = 1

# Vendored from github.com/Sank6/iCloud-Keychain-for-Linux (MIT) and modified here; see
# THIRD_PARTY_NOTICES.md. "aggregate" keeps any per-file header added during the cleanup.
[[annotations]]
path = ["src/passwords_app/icloud/**", "tests/unit/icloud/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Sankarsh Makam", "2026 Alex Mextner"]
SPDX-License-Identifier = "MIT"

# The Windows-ADI anisette helper, vendored from hinatamaxxx/AltServer-Linux (AGPL-3.0), modified (see THIRD_PARTY_NOTICES.md);
# the Dockerfile next to it is ours and carries its own MIT header.
[[annotations]]
path = [
    "docker/anisette/native-wine-anisette.cpp",
    "docker/anisette/server.py",
    "docker/anisette/start.sh",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 hinatamaxxx and AltServer-Linux contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Apple's public root CAs, pinned for gsa.apple.com; not ours to license.
[[annotations]]
path = "src/passwords_app/icloud/certs/apple-roots.pem"
precedence = "override"
SPDX-FileCopyrightText = "Apple Inc."
SPDX-License-Identifier = "LicenseRef-Apple-Root-Certificates"

# Documentation, data and configuration formats without a comment syntax (or where a header
# would end up in user-visible output), plus files generated by `rig apply`.
[[annotations]]
path = [
    "**/*.md",
    "**/*.json",
    "**/*.lock",
    "**/*.png",
    "**/*.jpg",
    "**/*.svg",
    "**/*.webm",
    "**/*.mp4",
    "**/*.gif",
    "**/.gitignore",
    "**/.gitkeep",
    "pyproject.toml",
    "rig.yaml",
    "data/**",
    "po/**",
    "tests/**/fixtures/**",
    "ci/**",
    ".haft/**",
    ".serena/**",
    ".github/pull_request_template.md",
    ".github/scripts/**",
    ".github/workflows/codeql.yml",
    ".github/workflows/dependency-review.yml",
    ".github/workflows/leftover-grep.yml",
    ".github/workflows/pr-checklist.yml",
    ".github/workflows/review-threads.yml",
    ".github/workflows/secret-scan.yml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Mextner"
SPDX-License-Identifier = "MIT"
