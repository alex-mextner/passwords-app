#
# Repository-specific bans (plan "Global Constraints"). These run offline, unlike the registry
# packs, so every machine enforces them.
rules:
  - id: tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      TLS verification is never disabled (Apple endpoints verify against
      icloud/certs/apple-roots.pem via passwords_app.icloud.tls).
    pattern-either:
      - pattern: $F(..., verify=False, ...)
      - pattern: $S.verify = False
      - pattern: urllib3.disable_warnings(...)
      - pattern: requests.packages.urllib3.disable_warnings(...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.check_hostname = False
      - pattern: $CTX.verify_mode = ssl.CERT_NONE

  - id: secret-in-log-call
    languages: [python]
    severity: ERROR
    message: >-
      Never log secrets, tokens, passwords, passcodes, 2FA codes or otpauth seeds; log an
      identifier or a redacted form instead.
    patterns:
      - pattern-either:
          - pattern: $LOG.$METHOD(..., $ARG, ...)
          - pattern: $LOG.$METHOD(..., f"...{$ARG}...", ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(debug|info|warning|warn|error|exception|critical|log)$
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i).*(password|passwd|passcode|secret|token|otpauth|totp_seed|private_key|master_key).*
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(log|logger|logging|_log|_logger|LOG|LOGGER)$

  - id: secret-in-print
    languages: [python]
    severity: ERROR
    message: Secrets must not reach stdout/stderr; the CLI prints them only on explicit request.
    patterns:
      - pattern-either:
          - pattern: print(..., $ARG, ...)
          - pattern: print(..., f"...{$ARG}...", ...)
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i).*(passcode|token|otpauth|totp_seed|private_key|master_key).*
