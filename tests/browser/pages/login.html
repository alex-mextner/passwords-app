<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="/site.css"></head>
<body>
  <header><span class="logo"></span><span data-brand></span></header>
  <main>
    <h1>Sign in</h1>
    <p class="lead">Welcome back to <span data-brand></span>.</p>
    <form method="post" action="/session" id="login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <button type="submit" id="submit">Sign In</button>
    </form>
    <p class="foot">New here? <a href="/signup.html">Create an account</a></p>
  </main>
  <script src="/site.js"></script>
</body>
</html>
