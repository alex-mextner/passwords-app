<html lang="en">
<head><meta charset="utf-8"><title>Create account</title><link rel="stylesheet" href="/site.css"></head>
<body>
  <header><span class="logo"></span><span data-brand></span></header>
  <main>
    <h1>Create your account</h1>
    <p class="lead">It takes less than a minute.</p>
    <form method="post" action="/account" id="signup">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username">
      <label for="new-password">Password</label>
      <input id="new-password" name="password" type="password" autocomplete="new-password">
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirm" type="password" autocomplete="new-password">
      <button type="submit" id="submit">Create Account</button>
    </form>
  </main>
  <script src="/site.js"></script>
</body>
</html>
