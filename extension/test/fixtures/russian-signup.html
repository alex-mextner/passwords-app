<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Регистрация · Пример</title></head>
<body>
<main>
  <h1>Регистрация</h1>
  <form id="reg" action="/register" method="post">
    <label for="rs-name">Имя</label><input id="rs-name" name="f1">
    <label for="rs-mail">Электронная почта</label><input id="rs-mail" name="f2">
    <label for="rs-p1">Придумайте пароль</label><input id="rs-p1" name="f3" type="password">
    <label for="rs-p2">Повторите пароль</label><input id="rs-p2" name="f4" type="password">
    <button type="submit">Зарегистрироваться</button>
  </form>
</main>
</body>
</html>
