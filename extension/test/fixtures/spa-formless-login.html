<html lang="en">
<head><meta charset="utf-8"><title>Tailspin</title></head>
<body>
<div id="app">
  <header class="topbar"><span class="logo">Tailspin</span><nav><a href="/">Home</a></nav></header>
  <main class="page">
    <div class="card">
      <h2 class="card-title">Log in to Tailspin</h2>
      <div class="field">
        <label for="user">Username</label>
        <input id="user" type="text" autocapitalize="off">
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input id="pass" type="password">
      </div>
      <div class="actions"><button type="button" class="btn btn-primary">Log in</button></div>
    </div>
  </main>
  <footer class="foot"><a href="/terms">Terms</a></footer>
</div>
</body>
</html>
