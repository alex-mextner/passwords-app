<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Security settings · Northwind</title></head>
<body>
<nav class="settings-nav"><a href="/settings/profile">Profile</a><a href="/settings/security">Security</a></nav>
<section class="settings">
  <h2>Change password</h2>
  <form id="pwform" action="/settings/password" method="post">
    <input type="text" id="acct" autocomplete="username" value="alex@example.com" hidden>
    <label for="cur">Current password</label>
    <input id="cur" type="password" name="current_password" autocomplete="current-password">
    <label for="new">New password</label>
    <input id="new" type="password" name="new_password" autocomplete="new-password">
    <label for="conf">Confirm new password</label>
    <input id="conf" type="password" name="new_password_confirmation" autocomplete="new-password">
    <button type="submit">Update password</button>
  </form>
</section>
</body>
</html>
