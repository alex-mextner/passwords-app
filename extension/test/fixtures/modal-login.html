<html lang="en">
<head><meta charset="utf-8"><title>Wingtip Toys</title></head>
<body>
<header><input id="site-search" type="search" placeholder="Search toys"></header>
<main><h1>New arrivals</h1><p>Wooden trains and more.</p></main>
<div class="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title">Log in to Wingtip</h2>
    <div class="modal-body">
      <input id="m-user" type="email" name="email" placeholder="Email">
      <input id="m-pass" type="password" name="password" placeholder="Password">
    </div>
    <div class="modal-footer">
      <button class="secondary">Cancel</button>
      <button class="primary">Log in</button>
    </div>
  </div>
</div>
</body>
</html>
