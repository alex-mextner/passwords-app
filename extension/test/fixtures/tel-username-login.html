<html lang="en">
<head><meta charset="utf-8"><title>Sign in · Margie's Travel</title></head>
<body>
<form id="tel" action="/signin" method="post">
  <h2>Sign in with your phone</h2>
  <label for="phone">Phone number</label>
  <input id="phone" type="tel" name="phone" autocomplete="tel">
  <label for="tpw">Password</label>
  <input id="tpw" type="password" name="password">
  <button type="submit">Sign in</button>
</form>
</body>
</html>
