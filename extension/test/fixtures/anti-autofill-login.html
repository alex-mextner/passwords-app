<html lang="en">
<head><meta charset="utf-8"><title>Bank login · Woodgrove</title></head>
<body>
<main>
  <h1>Online banking</h1>
  <form id="bank" action="/auth/logon" method="post">
    <label for="aa-user">Customer ID</label>
    <input id="aa-user" name="customerId" autocomplete="nope">
    <label for="aa-pass">Password</label>
    <input id="aa-pass" type="password" name="pwd" autocomplete="new-password">
    <button type="submit">Log on</button>
  </form>
</main>
</body>
</html>
