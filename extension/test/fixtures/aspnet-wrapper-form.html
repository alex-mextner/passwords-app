<html lang="en">
<head><meta charset="utf-8"><title>City Power &amp; Light</title></head>
<body>
<form id="aspnetForm" action="./Default.aspx" method="post">
  <input type="hidden" name="__VIEWSTATE" value="vs-example">
  <div id="header"><input id="ctl00_q" name="ctl00$Header$SearchBox" placeholder="Search…"><input type="submit" name="ctl00$Header$Go" value="Go"></div>
  <div id="loginPanel">
    <span>User name</span><input id="ctl00_user" name="ctl00$Main$UserName">
    <span>Password</span><input id="ctl00_pass" name="ctl00$Main$Password" type="password">

  </div>
  <div id="footer">
    <span>Sign up for our newsletter</span><input id="ctl00_news" name="ctl00$Footer$NewsletterEmail" type="email">

  </div>
</form>
</body>
</html>
