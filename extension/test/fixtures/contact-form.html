<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Contact · Graphic Design Institute</title></head>
<body>
<form id="contact" action="/contact" method="post">
  <h2>Get in touch</h2>
  <label for="ct-name">Your name</label><input id="ct-name" name="name">
  <label for="ct-email">Email</label><input id="ct-email" type="email" name="email">
  <label for="ct-subject">Subject</label><input id="ct-subject" name="subject">
  <label for="ct-msg">Message</label><textarea id="ct-msg" name="message"></textarea>
  <button type="submit">Send message</button>
</form>
</body>
</html>
