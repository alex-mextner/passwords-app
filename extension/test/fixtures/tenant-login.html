<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in · Relecloud</title></head>
<body>
<form id="tenant" action="/sso/login" method="post">
  <label for="t-email">Work email</label><input id="t-email" name="email" type="email">
  <label for="t-ws">Workspace</label><input id="t-ws" name="workspace">
  <label for="t-pass">Password</label><input id="t-pass" name="password" type="password">
  <button type="submit">Sign in</button>
</form>
</body>
</html>
