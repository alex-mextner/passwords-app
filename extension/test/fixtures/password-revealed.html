<html lang="en">
<head><meta charset="utf-8"><title>Log in · Lucerne Publishing</title></head>
<body>
<form id="revealed" action="/login" method="post">
  <input id="rv-user" name="username" autocomplete="username">
  <div class="password-wrapper">
    <input id="rv-pass" type="text" name="password" autocomplete="current-password">
    <button type="button" aria-label="Hide password">Hide</button>
  </div>
  <button type="submit">Log in</button>
</form>
</body>
</html>
