<html lang="en">
<head><meta charset="utf-8"><title>Enter password · Fabrikam</title></head>
<body>
<div class="shell">
  <h1>Enter password</h1>
  <form id="verify" action="/oauth/password" method="post">
    <input type="hidden" id="hidden-user" name="login" autocomplete="username" value="alex@example.com">
    <input type="email" id="account" value="alex@example.com" readonly aria-label="Account">
    <label for="passwd">Password</label>
    <input type="password" id="passwd" name="passwd" autocomplete="current-password">
    <a href="/reset">Forgot my password</a>
    <input type="submit" id="signin" value="Sign in">
  </form>
</div>
</body>
</html>
