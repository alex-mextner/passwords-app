<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reset your password · Wingtip</title></head>
<body>
<div class="container">
  <h1>Choose a new password</h1>
  <form id="reset" action="/password/reset" method="post">
    <input type="hidden" name="reset_token" value="rt-example">
    <label for="new1">New password</label>
    <input id="new1" type="password" name="password">
    <label for="new2">Confirm password</label>
    <input id="new2" type="password" name="password_confirmation">
    <button type="submit">Reset password</button>
  </form>
</div>
</body>
</html>
