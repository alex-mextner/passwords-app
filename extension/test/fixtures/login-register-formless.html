<html lang="en">
<head><meta charset="utf-8"><title>Blue Yonder</title></head>
<body>
<div class="tabs">
  <section id="signin">
    <h2>Sign in</h2>
    <input id="si-user" name="username" type="text">
    <input id="si-pass" name="password" type="password">
    <button>Sign in</button>
  </section>
  <section id="signup">
    <h2>Create account</h2>
    <input id="su-email" type="email" placeholder="Email">
    <input id="su-pass" name="password" type="password" placeholder="Password">
    <input id="su-confirm" type="password" placeholder="Repeat password">
    <button>Create account</button>
  </section>
</div>
</body>
</html>
