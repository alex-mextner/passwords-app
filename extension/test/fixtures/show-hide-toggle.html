<html lang="en">
<head><meta charset="utf-8"><title>Log in · Lucerne Publishing</title></head>
<body>
<form id="toggle-form" action="/login" method="post">
  <label for="tg-email">Email</label>
  <input id="tg-email" type="email" name="email" autocomplete="email">
  <label for="tg-pass">Password</label>
  <div class="password-wrapper">
    <input id="tg-pass" type="password" name="password">
    <button type="button" class="reveal" aria-label="Show password">Show</button>
  </div>
  <button type="submit">Log in</button>
</form>
</body>
</html>
