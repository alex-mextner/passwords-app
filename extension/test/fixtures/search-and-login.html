<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Help center · Fourth Coffee</title></head>
<body>
<header>
  <form id="search" role="search" action="/search">
    <input id="q" type="search" name="q" placeholder="Search">
  </form>
  <div class="docs-search"><input id="q2" type="text" name="q" placeholder="Search docs"></div>
</header>
<main>
  <form id="login" action="/login" method="post">
    <h2>Log in</h2>
    <input id="login-user" name="login" type="text" placeholder="Username or email">
    <input id="login-pass" name="password" type="password" placeholder="Password">
    <button type="submit">Log in</button>
  </form>
</main>
</body>
</html>
