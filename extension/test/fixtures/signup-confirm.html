<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Join Litware</title></head>
<body>
<main>
  <h1>Create your Litware account</h1>
  <form id="signup" action="/users" method="post">
    <div class="row">
      <label for="first">First name</label><input id="first" name="user[first_name]" autocomplete="given-name">
      <label for="last">Last name</label><input id="last" name="user[last_name]" autocomplete="family-name">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" name="user[email]" autocomplete="email">
    <label for="pw">Password</label>
    <input id="pw" type="password" name="user[password]" autocomplete="new-password" minlength="12">
    <label for="pw2">Confirm password</label>
    <input id="pw2" type="password" name="user[password_confirmation]" autocomplete="new-password">
    <label><input type="checkbox" id="terms" name="terms"> I accept the terms</label>
    <button type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="/login">Sign in</a></p>
</main>
</body>
</html>
