<html lang="en">
<head><meta charset="utf-8"><title>Admin · Trey Research</title></head>
<body>
<form id="admin" action="/admin/login" method="post">
  <label for="a-user">Username</label><input id="a-user" name="username">
  <label for="a-pass">Password</label><input id="a-pass" name="password" type="password">
  <label for="a-otp">Two-factor code (if enabled)</label><input id="a-otp" name="otp" inputmode="numeric" maxlength="6">
  <button type="submit">Sign in</button>
</form>
</body>
</html>
