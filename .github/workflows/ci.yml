#
# Every spec §12 quality gate, one job per scripts/check.sh group, so CI and a developer's
# `scripts/check.sh <group>` run the same commands. Jobs run in the Ubuntu release the app
# targets (system PyGObject, GTK 4, libadwaita and gnome-keyring come from its archive).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job declares the least it needs; nothing is granted by default.
permissions: {}

# A newer push to a PR makes its running checks moot; main runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEBIAN_FRONTEND: noninteractive
  # Python packages the app imports from the system (--system-site-packages venv).
  GI_PACKAGES: python3-gi gir1.2-glib-2.0 gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
    steps:
      # git must exist before checkout, or it falls back to a tarball without history.
      - &install-git
        name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        # `./` rather than `$/`: actionlint does not parse `$/` yet (rhysd/actionlint#711).
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          apt-packages: curl shellcheck shfmt
      - name: Install actionlint and zizmor
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  /tmp/$tarball" | sha256sum -c -
          tar -xzf "/tmp/$tarball" -C /usr/local/bin actionlint
          uv tool install "zizmor==${ZIZMOR_VERSION}"
          uv tool dir --bin >>"$GITHUB_PATH"
      - name: Check
        run: scripts/check.sh lint

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    steps:
      - *install-git
      - *checkout
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          # pyright's PyPI wrapper uses a system node instead of downloading one.
          apt-packages: nodejs ${{ env.GI_PACKAGES }}
      - name: Check
        run: scripts/check.sh types

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    env:
      # Ubuntu's gitleaks predates the `git`/`dir` subcommands check.sh uses.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - *install-git
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          apt-packages: curl
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "/tmp/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  /tmp/$tarball" | sha256sum -c -
          tar -xzf "/tmp/$tarball" -C /usr/local/bin gitleaks
      - name: Check
        run: scripts/check.sh security

  data:
    name: Data files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    steps:
      - *install-git
      - *checkout
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          apt-packages: appstream desktop-file-utils libglib2.0-bin libglib2.0-dev-bin libxml2-utils
      - name: Check
        run: scripts/check.sh data

  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    steps:
      - *install-git
      - *checkout
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          # unzip: setup-bun unpacks a zip. nodejs: eslint/tsc/prettier/web-ext have node shebangs.
          apt-packages: unzip nodejs
      - &install-bun
        name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true # a cache shared across PRs could be poisoned
      - name: Check
        run: scripts/check.sh extension

  tests:
    name: Unit, integration and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # checkout
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    steps:
      - *install-git
      - *checkout
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          # The integration tests start their own private dbus-daemon and gnome-keyring-daemon;
          # the app data-file tests need the real validators and msgfmt.
          apt-packages: >-
            dbus-daemon gnome-keyring appstream desktop-file-utils gettext libxml2-utils
            ${{ env.GI_PACKAGES }}
      - name: Check
        # One job: coverage reuses this run's unit + integration data instead of re-running them.
        run: scripts/check.sh unit integration coverage

  e2e:
    name: GUI and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    steps:
      - *install-git
      - *checkout
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          # No GPU on hosted runners: with no /dev/dri, mutter and GTK fall back to Mesa's
          # llvmpipe (libgl1-mesa-dri). python3-gi-cairo lets GTK draw functions get a cairo context.
          # curl, gpg: the Firefox install; unzip: setup-bun.
          apt-packages: >-
            gnome-shell mutter gsettings-desktop-schemas at-spi2-core xdg-desktop-portal
            dbus-daemon gnome-keyring pipewire wireplumber gstreamer1.0-pipewire
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good ffmpeg gettext
            libgl1-mesa-dri libegl-mesa0 libglx-mesa0 fonts-cantarell fonts-dejavu-core
            adwaita-icon-theme python3-gi-cairo curl gpg unzip ${{ env.GI_PACKAGES }}
      # The scenarios save and fill passwords through the extension in real browsers.
      - &install-firefox
        name: Install Firefox and geckodriver
        env:
          # Ubuntu ships Firefox and Chromium only as snaps, which do not run in a container:
          # Firefox comes from Mozilla's apt repository, Chromium from Playwright.
          MOZILLA_KEY_FINGERPRINT: 35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3
          GECKODRIVER_VERSION: 0.37.1
          GECKODRIVER_SHA256: e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e
        run: |
          set -euo pipefail
          key=/etc/apt/keyrings/packages.mozilla.org.asc
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSLo "$key" https://packages.mozilla.org/apt/repo-signing-key.gpg
          fingerprint=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')
          [ "$fingerprint" = "$MOZILLA_KEY_FINGERPRINT" ]
          printf '%s\n' 'Types: deb' 'URIs: https://packages.mozilla.org/apt' 'Suites: mozilla' \
            'Components: main' "Signed-By: $key" >/etc/apt/sources.list.d/mozilla.sources
          # Outrank Ubuntu's snap-installing transitional firefox package.
          printf '%s\n' 'Package: *' 'Pin: origin packages.mozilla.org' 'Pin-Priority: 1000' \
            >/etc/apt/preferences.d/mozilla
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends firefox
          tarball="geckodriver-v${GECKODRIVER_VERSION}-linux64.tar.gz"
          curl -fsSLo "/tmp/$tarball" \
            "https://github.com/mozilla/geckodriver/releases/download/v${GECKODRIVER_VERSION}/$tarball"
          echo "$GECKODRIVER_SHA256  /tmp/$tarball" | sha256sum -c -
          tar -xzf "/tmp/$tarball" -C /usr/local/bin geckodriver
      - &install-chromium
        name: Install Chromium
        run: .venv/bin/playwright install --with-deps chromium
      - *install-bun
      - name: Build the extension
        working-directory: extension
        run: bun install --frozen-lockfile && bun run build
      - name: Check
        env:
          # The apt Firefox above, not a Selenium Manager download at test time.
          PA_FIREFOX: /usr/bin/firefox
          PA_GECKODRIVER: /usr/local/bin/geckodriver
        run: scripts/check.sh gui e2e
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-proof
          path: |
            docs/proof/**
            .check-logs/
          if-no-files-found: ignore
          include-hidden-files: true # .check-logs/ is a dot directory, skipped by default
          retention-days: 7

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    steps:
      - *install-git
      - *checkout
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          # unzip: setup-bun unpacks a zip; the browser tests build the extension with bun.
          apt-packages: curl gpg dbus-daemon gnome-keyring ffmpeg unzip ${{ env.GI_PACKAGES }}
      - *install-bun
      - *install-firefox
      - *install-chromium
      - name: Check
        run: scripts/check.sh browser
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-proof
          path: |
            docs/proof/**
            .check-logs/
          if-no-files-found: ignore
          include-hidden-files: true # .check-logs/ is a dot directory, skipped by default
          retention-days: 7

  bench:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    container:
      image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    steps:
      - *install-git
      - *checkout
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          # Budgets cover keyring fetch and app cold start, so the GUI stack is needed too.
          apt-packages: >-
            gnome-shell mutter gsettings-desktop-schemas at-spi2-core dbus-daemon gnome-keyring
            libgl1-mesa-dri libegl-mesa0 libglx-mesa0 fonts-cantarell fonts-dejavu-core
            adwaita-icon-theme python3-gi-cairo ${{ env.GI_PACKAGES }}
      - name: Check
        run: scripts/check.sh bench
